rtx.zUp = False
rtx.sceneScale = 0.0025
rtx.useVertexCapture = False
rtx.camera.lockFreeCamera = False
rtx.ignoreAllVertexColorBakedLighting = True
rtx.vertexColorIsBakedLighting = False
rtx.captureInstances = True
rtx.legacyMaterial.roughnessConstant = 1
rtx.enableRaytracing = True
rtx.uniqueObjectDistance = 1
rtx.atmosphere.nightSkyBrightness = 0.004
# The clouds are switched off by the time-of-day code (ClearSky), but their shadow on
# the ground is a separate term that stays: it hid the sun at noon (FIX-REMIX-2). The
# DLL pushes 1 back when clouds are wanted.
rtx.atmosphere.cloudShadowStrength = 0
rtx.ignoreGameDirectionalLights = True
rtx.fallbackLightMode = 0
# Post (REMIX-POST): the runtime turns motion blur, chromatic aberration and vignette on
# by default; the game's own picture has none of them. Slow exposure adaptation so lamps
# and headlights passing do not pump the picture.
rtx.postfx.enableMotionBlur = False
rtx.postfx.enableChromaticAberration = False
rtx.postfx.enableVignette = False
rtx.autoExposure.darkAdaptTau = 2.5
rtx.autoExposure.lightAdaptTau = 0.8

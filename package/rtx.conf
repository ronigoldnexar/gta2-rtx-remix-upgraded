rtx.zUp = False
rtx.sceneScale = 0.0025
rtx.useVertexCapture = False
rtx.camera.lockFreeCamera = False
rtx.ignoreAllVertexColorBakedLighting = True
rtx.vertexColorIsBakedLighting = False
rtx.captureInstances = True
rtx.legacyMaterial.roughnessConstant = 1
rtx.enableRaytracing = True
rtx.uniqueObjectDistance = 1
rtx.atmosphere.nightSkyBrightness = 0.004
# The clouds are switched off by the time-of-day code (ClearSky), but their shadow on
# the ground is a separate term that stays: it hid the sun at noon (FIX-REMIX-2). The
# DLL pushes 1 back when clouds are wanted.
rtx.atmosphere.cloudShadowStrength = 0
rtx.ignoreGameDirectionalLights = True
rtx.fallbackLightMode = 0
# Post (REMIX-POST): the runtime turns motion blur, chromatic aberration and vignette on
# by default; the game's own picture has none of them. Slow exposure adaptation so lamps
# and headlights passing do not pump the picture.
rtx.postfx.enableMotionBlur = False
rtx.postfx.enableChromaticAberration = False
rtx.postfx.enableVignette = False
rtx.autoExposure.darkAdaptTau = 2.5
rtx.autoExposure.lightAdaptTau = 0.8

# FIX-REMIX-NIGHT-9 (prx1): replacement-texture streaming without sampler feedback. With feedback on (the
# runtime's default) a small prop seen a few blocks away stays on the mip the GPU sampled for it (the stop
# sign's 256 px face read as a blurred 8-16 texel disc at night); off, every replacement texture streams to
# its top level within the budget and is never downgraded once there. Same-pose A/B (wil stop sign, fixed
# cameras, 21:00): crisp octagon and STOP; frame time 43.7 -> 42.8 ms, VRAM peak 6.25 -> 6.75 GB of 23 GB.
rtx.texturemanager.samplerFeedbackEnable = False
rtx.texturemanager.neverDowngradeTextures = True

# LIGHTING-V1 (gate C): the play look (gamerun/rtx_play.conf.extra, what every Remix test and the owner's 5090 ran
# through playlook.ps1) folded in, so the shipped rtx.conf is what was tested. Only the look: the Wine/GPU-specific
# keys (frame generation, Reflex, the upscaler, the quality preset, the stall timeout) stay with the launchers.
# The time-of-day keys (exposure cap, airglow) are pushed live by the renderer; these are their starting values.
rtx.ignoreGameDirectionalLights = True
rtx.fallbackLightMode = 0
rtx.atmosphere.surfaceMoonBrightness = 3
rtx.atmosphere.nightSkyBrightness = 0.008
rtx.autoExposure.maxExposure = 2.5
rtx.autoExposure.targetAdaptedYf = 0.13
rtx.autoExposure.darkAdaptTau = 2.5
rtx.autoExposure.lightAdaptTau = 0.8
rtx.bloom.enable = True
rtx.bloom.steps = 6
rtx.bloom.luminanceThreshold = 0.9
rtx.bloom.burnIntensity = 0.55
rtx.fireflyFilteringLuminanceThreshold = 400
rtx.postfx.enableMotionBlur = False
rtx.postfx.enableChromaticAberration = False
rtx.postfx.enableVignette = False
rtx.legacyMaterial.roughnessConstant = 0.75
rtx.legacyMaterial.metallicConstant = 0.05
rtx.sharpening.sharpness = 0.2
rtx.texturemanager.samplerFeedbackEnable = False
rtx.texturemanager.neverDowngradeTextures = True

# RELEASE PRESET (14 Nov 2026): the RTX 5090 release soak (48 min, the shipped setup, warps every minute, day/night
# cycling: 0 TDR, 0 FAULT, game fps median 30, VRAM <= 9.7 GB, largest free block >= 1760 MB), the exact keys of
# C:\gta2\play\rtx.conf: DLSS Balanced + Ray Reconstruction + the Neural Radiance Cache + Reflex.
# Frame Generation (DLSS-G) is OFF by default: it needs an RTX 40/50 card, and on the RTX PRO 6000 vGPU (no optical-flow
# engine) the Proton path lost the device when it engaged (docs/remix-rtx6000-report.md, ngx30/43/44). On an RTX 40/50
# set rtx.frameGenerationType = 1 (what the 5090 soak ran). DLSS, RR and NRC fall back by themselves where the card or
# the driver lacks them (TAA-U; importance-sampled indirect light, as on the L4 and the 6000 under Wine).
rtx.graphicsPreset = 4
rtx.dlssPreset = 2
rtx.upscalerType = 1
rtx.qualityDLSS = 2
rtx.enableRayReconstruction = True
rtx.integrateIndirectMode = 2
rtx.frameGenerationType = 0
rtx.isReflexEnabled = True
rtx.reflexMode = 1
rtx.hideSplashMessage = True

; LIGHTING-V1 (gate C): the shipped effects ini. It is the v1.1 file every install already carries (the
; tested values for every category, headlights included) with the sirens' tuning reconciled: [general]
; SirensVersion=2 lets this file's [Sirens] be read, and [Sirens] lists the compiled defaults (LIGHTBAR /
; FIX-REMIX-NIGHT-4: a 0.07 bulb at intensity 10, a 40 deg cone 6 deg down), so the file and the build agree.
; GTA2 RTX Remix -- lights for effects the game does not light itself.
;
; Bind lines map a particle type id to a category. GTA2 gives every particle
; a type at +0x38; which id is which effect is not written down anywhere, so
; the F4 menu's Diagnostics tab lists the ids as they appear and you bind them by
; triggering the effect and watching which one lights up.
;
; Categories: 0=Muzzle flash, 1=Bullet, 2=Sparks, 3=Cigarette, 4=Fire, 5=Headlights, 6=Brake lights, 7=Electricity, 8=Car lamps, 9=Flamethrower, 10=Sirens
; Headlights and brake lights take no particle types -- they come off the
; vehicle list.


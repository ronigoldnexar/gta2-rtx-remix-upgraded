; GTA2 RTX Remix renderer.
;
; This file is required. Two of its settings have defaults in the code that are
; deliberately the *old* behaviour, so without this file the renderer sits behind
; the original one and draws nothing of its own.

[renderer]
; takeover - the renderer owns the device and draws the world in 3D. This is the
; one you want. proxy forwards everything to GTA2's original renderer instead,
; which is only useful for comparing the two.
mode=takeover

; Where the picture is presented. GTA2's video device owns the game's own window
; and paints an empty framebuffer over anything sharing it, so the renderer
; presents into a topmost window of its own.
;   0 = the game's window   (deadlocks RTX Remix's first Present)
;   1 = a child of it       (still loses to the video device)
;   2 = our own window, which is the one that works
own_window=2

; What to render at. GTA2's own resolution only lays the HUD out - the overlay
; pass scales that to whatever it is drawn into - so the path traced image does
; not have to inherit the 640x480 its options screen writes. 0 means the desktop
; resolution, which is almost always what you want.
render_width=0
render_height=0

; Frame cap.
;
; GTA2 advances its simulation exactly one step per rendered frame and scales
; nothing by elapsed time, so this is the game's SPEED as well as its smoothness.
; 30 is the original pace. 60 is twice as fast and visibly brisk. 0 removes the
; cap entirely, which is as fast as the machine allows and unplayable.
;
; There is no setting that gives 60 fps of motion at normal speed; that would
; need the game's own per-step constants halved, which a renderer cannot do.
fps_cap=30

; Tile artwork captured from the running game rather than parsed from the .sty.
use_game_tiles=1

; High-resolution tiles. If gta2dx9_textures_hd\tile_NNNN.dds (block-compressed,
; with mips: tools\pack_textures_dds.py) or tile_NNNN.tga exists beside the game
; it is used for that tile (tools\upscale_textures.py and
; tools\enhance_textures_sd.py make them on a GPU from a dump). dump_tiles=1
; writes every tile a level uses to gta2dx9_tiles\ when the level loads, which
; is that dump.
dump_tiles=0
; The largest size those tiles are uploaded at; a DDS skips its levels above
; this, a TGA is shrunk on load. 512 px DDS tiles (DXT1, mips) take 175 KB each,
; about 150 MB for a level, and need a large-address-aware gta2.exe (the Linux
; installer sets that flag); uncompressed TGAs were limited to 128 px.
hd_tile_max=512
; water_effect - in the street views, the water tiles get drifting ripples and
; a tint of the sky (the classic view never changes). 0 leaves them flat.
water_effect=1
; Anisotropic filtering of the HD tiles. 0 (default) means 8x on a GPU and plain
; trilinear on a software renderer such as Mesa's llvmpipe, where 8x costs most
; of the frame; 1..16 forces a level.
anisotropy=0

; car_models3d - in the street-level views (third and first person), draw each
; car as a 3D body instead of its flat sprite: a hand-made model when
; gta2dx9_models\manifest.json names one for the vehicle's model number, else a
; body built from the car's own sprite. Verified on the Linux build; 0 turns it off.
car_models3d=1

; Diagnostics. 1 writes every distinct frame of artwork beside the game as a TGA
; and a CSV of how each was classified. Useful when something looks wrong, and
; several thousand files when it does not.
dump_textures=0

[timeofday]
; A day/night cycle, driven into RTX Remix's own sun through its API. The angles
; come from the real solar position equations for the latitude and season below,
; so the sun rises in the east, is highest at local noon, and spends the night as
; far below the horizon as it really would - which is what makes 2am dark rather
; than merely dim. 0 leaves whatever sun your rtx.conf sets.
enabled=1

; Clock when a level starts, HHMM. 200 is 02:00, which is deep night everywhere.
start_hhmm=200

; 1 stops the clock, so every level starts at start_hhmm and stays there: a fixed
; time of day, if you would rather always play at night, or at noon. 0 (default)
; lets the day run. Also the Paused box on the Time of day tab of the F4 menu.
paused=0

; Tenths. 10 = one real second to one game minute, a full day in 24 real minutes.
game_minutes_per_second_tenths=10

; When the lights that are off in daylight go out and come back on, HHMM: out by
; 06:00, on from 18:00, each over a short fade. Also on the Time of day tab of
; the F4 menu.
lights_off_hhmm=600
lights_on_hhmm=1800

; Tenths of a degree. Latitude sets how high the sun climbs; declination sets the
; season (+234 midsummer, 0 equinox, -234 midwinter).
latitude_tenths=400
declination_tenths=0

[sky]
; The sky of the third- and first-person views: a dome with a sun and soft
; clouds, distance haze in the horizon's colour so streets fade into the sky
; instead of ending in black, and a directional sun on the city so the walls
; that face it are the brighter ones. The classic top-down view is never
; touched; the sky fades up and down with the move between views. Under a
; Remix runtime that draws its own atmosphere the dome is left out. 0 turns
; all of it off.
enabled=1

; 1 takes the sun from the [timeofday] clock (so a 02:00 start is a night sky
; and the day runs). 0 (default) keeps it where the two lines below put it,
; because without RTX Remix nothing else in the picture goes dark at night.
follow_clock=0
; Tenths of a degree. Elevation above the horizon; azimuth is a compass bearing
; over the map, 0 north (up the map), 90 east. The default is a late afternoon.
sun_elevation_tenths=240
sun_azimuth_tenths=2350

; Distance haze, in blocks: none nearer than start, the full horizon colour
; from end. The map is 256 blocks across.
fog_start_blocks=30
fog_end_blocks=140

; How much of the sky the clouds cover, percent. 0 is a clear sky.
cloud_cover_percent=45

; The lighting of the city in those views, percent of the artwork's own
; brightness: ambient everywhere, plus the sun on a face that squarely faces
; it. 100 and 0 draw the artwork as the classic view does.
ambient_percent=80
sun_light_percent=40

[camera]
; Tenths of a degree. Zoom and position come from the game; these only frame it.
; -900 looks straight down, which is what GTA2 was drawn for.
pitch_tenths=-900
fov_tenths=400

; --- Third person and first person --------------------------------------
;
; mode - the view a level starts in: classic (GTA2's own, from above), third
; (a chase camera behind you, on foot or at the wheel, with mouse orbit) or
; first (from your eyes or the driving seat, with mouse look).
mode=classic
;
; toggle_key - the key that cycles the three views in game. A single letter
; or digit, an F-key (F6), or a virtual-key code (0x56). V is free in GTA2's
; default controls.
toggle_key=V
;
; Everything else about the two views - distances, heights, fields of view,
; mouse sensitivity, whether pedestrians are stood up - is on the Camera tab
; of the F4 menu and saved to gta2dx9_settings.ini with the Save button.
;
; demo_switch_seconds - for recording a demonstration: this many seconds after
; a level comes up, the view switches by itself to demo_switch_to (1 third
; person, 2 first person), as if the key had been pressed. 0 never does.
; tools\record_demo.ps1 sets these and records the screen.
demo_switch_seconds=0
demo_switch_to=2

[renderer]
; --- Objects in a wide frame's margins ---------------------------------
;
; spawn_offscreen - GTA2 works out what is on screen as a 4:3 rectangle
; whatever the screen really is, and creates and removes cars and
; pedestrians just outside it. A 16:9 frame of the same height is wider,
; so that happens inside our left and right edges and things appear out
; of nothing. The top and bottom never show it because the frame keeps
; GTA2's own height exactly.
;
; 1 (default) makes that rectangle the shape of the frame we draw, at
; the one place gta2.exe builds it, so spawning, recycling and drawing
; all move out together.
; 0 leaves gta2.exe byte for byte as it shipped, popping included. The
; same switch is on the Sprites tab of the F4 menu and can be turned off
; while the game is running: the patch keeps the bytes it replaced.
spawn_offscreen=1
;
; blood - GTA2 leaves a pool of blood under a body, but only with a debug
; flag the retail game keeps off. 1 (default) turns it on; 0 leaves the
; game's own setting alone. Also on the Sprites tab of the F4 menu.
blood=1
;
; gibs - experimental. A pedestrian killed by an explosion (grenade, rocket,
; a car going up) bursts into blood and flying limbs and the body goes, using
; sprites GTA2 ships but never draws. The limbs lie where they land and clear
; away with the blood. 0 (default) leaves deaths as the game has them; 1 turns
; it on. Also on the Sprites tab of the F4 menu.
gibs=0
;
; own_car_lamps - 1 (default) draws each lit car lamp as a small quad of its
; own, laid on the car and showing that car's own lamp pixels, so a lamp glows
; exactly where the car's artwork puts it. 0 draws GTA2's own lamp quad, a
; car-sized texture per car and lamp mix. Also on the Sprites tab of the F4 menu.
own_car_lamps=1
;
; gibs_car - with gibs on, pedestrians killed by a car come apart too, not only
; those killed by explosions. 0 (default) is explosions only; 1 adds cars.
gibs_car=0
;
; intro - the DMA Design intro movie at startup. 1 (default) plays it, drawn
; by the renderer; 0 skips it. Either way it no longer goes through
; DirectDraw, which could crash the game at startup. Overrides the game's own
; do_play_movie setting.
intro=1
;

[devtools]
; Developer aids for scripted sessions (linux/docker/run_game.sh and the
; gamerun scripts drive the game from the renderer's log). All off by default.
; log_keys=1 writes one log line per press and release of the game's control
; keys. warp_key moves the player to the driver's door of the nearest parked
; car; scene_key brings the nearest parked car to scene_xy, heading east,
; A third number is the map level (z), e.g. 160.7,132.1,3: otherwise the level is left alone.
; with the player at its door - which is how the driving demonstration
; (tools: gamerun/drive_road.py) gets a car on a real road.
log_keys=0
warp_key=
scene_key=
scene_xy=164.5,149.5
; ped_remap_override: a developer aid for the 3D people's types. -1 (default)
; draws each pedestrian as the remap the game gave him; 0..52 draws every
; pedestrian but the player as that remap (0 police, 4 army, 8 Zaibatsu, 11
; Loony, 13 Yakuza, 14 fireman, 16 medic...); -2 deals the uniformed and gang
; types out across the crowd, to see them all at once.
ped_remap_override=-1
; wreck_models - 1 draws every car in the street views as one of the burnt-out
; wreck models (072..081), to check them without blowing a car up.
wreck_models=0

remix_beacon_quads=0
; remix_beacon_cap_milli - that cap's half-size in tiles x1000 (default 22; 0 = no cap). Remix only.
remix_beacon_cap_milli=22
; remix_puff_mode - 4 (FIX-FX-6, 10 Nov 2026): soft alpha-blended smoke puffs under Remix in the street views, the

; GTA2 RTX Remix renderer.
;
; This file is required. Two of its settings have defaults in the code that are
; deliberately the *old* behaviour, so without this file the renderer sits behind
; the original one and draws nothing of its own.

[renderer]
; takeover - the renderer owns the device and draws the world in 3D. This is the
; one you want. proxy forwards everything to GTA2's original renderer instead,
; which is only useful for comparing the two.
mode=takeover

; Where the picture is presented. GTA2's video device owns the game's own window
; and paints an empty framebuffer over anything sharing it, so the renderer
; presents into a topmost window of its own.
;   0 = the game's window   (deadlocks RTX Remix's first Present)
;   1 = a child of it       (still loses to the video device)
;   2 = our own window, which is the one that works
own_window=2

; keep_game_window_restored - 1 (default; FIX-STABILITY-2, owner-5090-minimize-fatal): with own_window=2,
;   GTA2's own window is never left minimised. GTA2 minimises it itself when it loses the focus and then
;   waits in a message loop until it is restored, which nothing ever did, because the picture is in our
;   window: the freeze of the owner's 5090. Now the minimise is refused (SC_MINIMIZE), withheld from GTA2
;   (WM_SIZE SIZE_MINIMIZED) and undone at once without taking the focus back; the game keeps running
;   behind the window that took the focus. Log: 'focus: game window kept un-minimised'. 0 = the old
;   behaviour (the game pauses until its window is restored), for an A/B only.
keep_game_window_restored=1

; ignore_saved_settings - 0 (default): gta2dx9_settings.ini, the F4 menu's Save file, is read after this
;   file and wins wherever the two overlap (StartHour, MinutesPerSecond, FpsCap, AlphaMode/AlphaRef,
;   Sprite*, HudFit, the light and map-light gates...). Since FIX-STABILITY-2 each value it changes is
;   logged at startup, one line per key: 'settings override: [timeofday] MinutesPerSecond ini=0.20000
;   settings=1.00000', and Save writes only the values the menu changed away from what this file gives,
;   so a value never touched in the menu keeps following this file. 1 = do not read the settings file at
;   all: this file is the whole truth for the run (a test that sets a key here then tests that value).
ignore_saved_settings=0

; What to render at. GTA2's own resolution only lays the HUD out - the overlay
; pass scales that to whatever it is drawn into - so the path traced image does
; not have to inherit the 640x480 its options screen writes. 0 means the desktop
; resolution, which is almost always what you want.
render_width=0
render_height=0

; Frame cap.
;
; GTA2 advances its simulation exactly one step per rendered frame and scales
; nothing by elapsed time, so this is the game's SPEED as well as its smoothness.
; 30 is the original pace. 60 is twice as fast and visibly brisk. 0 removes the
; cap entirely, which is as fast as the machine allows and unplayable.
;
; There is no setting that gives 60 fps of motion at normal speed; that would
; need the game's own per-step constants halved, which a renderer cannot do.
fps_cap=30

; Tile artwork captured from the running game rather than parsed from the .sty.
use_game_tiles=1

; High-resolution tiles. If gta2dx9_textures_hd\tile_NNNN.dds (block-compressed,
; with mips: tools\pack_textures_dds.py) or tile_NNNN.tga exists beside the game
; it is used for that tile (tools\upscale_textures.py and
; tools\enhance_textures_sd.py make them on a GPU from a dump). dump_tiles=1
; writes every tile a level uses to gta2dx9_tiles\ when the level loads, which
; is that dump.
dump_tiles=0
; The largest size those tiles are uploaded at; a DDS skips its levels above
; this, a TGA is shrunk on load. 512 px DDS tiles (DXT1, mips) take 175 KB each,
; about 150 MB for a level, and need a large-address-aware gta2.exe (the Linux
; installer sets that flag); uncompressed TGAs were limited to 128 px.
hd_tile_max=512
; photo_tiles - load the photo-material tiles from gta2dx9_textures_hd\photo\<style>\
; first (tools\photoreal_tiles.py: the HD tile with the grain and micro-relief of a
; real photo-scanned material, same layout). Never used on an RTX Remix device, whose
; materials are keyed by the HD set. Street views only: the classic view always draws the
; plain HD set (both are loaded, the photo one is bound while a street view shows).
; 0 uses the plain HD set; a missing folder is the same.
photo_tiles=1
; road_markings - the road tiles with painted markings (lane dashes, zebra bars, SLOW and
; STOP, arrows) from gta2dx9_textures_hd\roads\<style>\: the paint drawn again as clean
; shapes over the photo asphalt (tools\reauthor_road_markings.py) instead of the upscalers'
; noise. Street views only, never on an RTX Remix device (the classic view and Remix keep the
; plain HD set). 0 off; a missing folder is the same.
road_markings=1
; tone_match - in the street views, the unpainted asphalt of every road tile is tinted (at
; most 12%) to the district's median asphalt colour, so the road reads as one surface
; instead of tile-sized tone blocks. Pavements, grass and roofs are left alone. Only the
; street-view copy is changed: the files, the classic view and RTX Remix keep the tile.
; 1 (default) on, 0 off.
tone_match=1
; water_effect - in the street views, the water tiles get drifting ripples and
; a tint of the sky (the classic view never changes). 0 leaves them flat.
water_effect=1
; water_shader - in the street views (no RTX Remix), the water tiles are drawn by a
; small shader instead: drifting waves, the sky reflected by angle (Fresnel), a sun
; glint, foam along quays and banks, the scene's fog. 1 (default) on, 0 back to the
; ripple above. water_waves / water_reflection / water_foam scale each part in
; percent, 0..200 (100 = default). docs/water.md.
water_shader=1
water_waves=100
water_reflection=100
water_foam=100
; window_glow - in the street views, the glass of window tiles is lit from inside
; (warm room light, some panes dark) when the sun is low; nothing at noon and never
; in the classic view. By day the same panes reflect the sky (GTA2DX9_WINDOW_SKY=0 turns
; that off). The glass is only looked for inside the window boxes the facade pass found
; (tools/facade_boxes.json; GTA2DX9_WINDOW_GLOW_BOXES=0: the old colour-run detector alone).
; 1 (default) on, 0 off.
window_glow=1
; Anisotropic filtering of the HD tiles. 0 (default) means 8x on a GPU and plain
; trilinear on a software renderer such as Mesa's llvmpipe, where 8x costs most
; of the frame; 1..16 forces a level.
anisotropy=0

; car_models3d - in the street-level views (third and first person), draw each
; car as a 3D body instead of its flat sprite: a hand-made model when
; gta2dx9_models\manifest.json names one for the vehicle's model number, else a
; body built from the car's own sprite. Verified on the Linux build; 0 turns it off.
car_models3d=1

; car_lamps - lamps on the 3D car bodies in the street-level views: 1 (default)
; headlamps and tail lamps glow when the sky's sun is down ([sky] elevation or
; clock), and brake lamps flare while a car is losing speed, day or night;
; 2 keeps the headlamps lit always; 0 draws none.
car_lamps=1

; contact_shadows - street views, plain renderer (not Remix, not the classic view): a soft
; dark contact patch on the ground under every car, pedestrian and street prop, so they stand
; on the road instead of floating over it. Percent opacity at midday (dimmer at night);
; 0 turns it off. Default 70.
contact_shadows=70

; tyre_shadows - with contact_shadows: each drawn tyre also gets its own small, darker contact
; patch where it meets the road, so the wheels sit on it. 1 on (default), 0 off.
tyre_shadows=1

; (no key) street sign plates - street views, plain renderer: the sign plate textures (sign_stop,
; sign_oneway, the bus shelter's BUS plate, pickup_health) get a mip chain and are sampled anisotropic,
; so a plate across the street reads as its word instead of 8 px blocks (FIX-WORLD-12 qav2).
; GTA2DX9_PROP_MIPS=0 in the environment: one level as before (A/B). Remix devices are untouched.
; (no key) a spinning pickup faded at the lens is drawn depth first (one see-through solid);
; GTA2DX9_FADE_SIGN=0 restores the old see-through draw for it and for the booth sign (A/B).

; car_glass - street views, plain renderer (not Remix, not the classic view): the car bodies'
; painted windows become glass (VEHICLE-GLASS, docs/car-glass.md). Each model's glass is found
; once from its own mesh and texture (the glasshouse between the belt and the roof that is not
; the body's paint), cut from the hull, drawn translucent with the sky's reflection after the
; figures, with a dark cabin (floor, headliner, dash, seat backs) behind it, so the seated
; driver shows and you never see through the car. 1 (default) on, 0 off.
; car_glass_alpha - the glass's opacity in percent (default 52).
; car_glass_range - blocks from the eye within which cars get glass (default 40); farther cars
; keep the painted windows (they are a few pixels tall there).
; Session switches (environment, for same-pose A/B): GTA2DX9_GLASS_BELT=0 drops VEHICLE-GLASS-4's
; near-black windows over the paint belt (071 Rumbler's side glass; docs/car-glass.md section 9),
; GTA2DX9_GLASS_REAR_GATE=1 the old Remix gate (a seated car with no rear screen found drew no glass),
; GTA2DX9_GLASS_SPLIT=0 the Remix whole-triangle vote, GTA2DX9_GLASS_REMIX=0 nothing under Remix,
; GTA2DX9_GLASS_DUMP=1 writes each mask as /out/glass_<texture>.pgm.
car_glass=1
car_glass_alpha=52
car_glass_range=40

; car_smooth_normals - the image-to-3D car bodies' vertex normals welded across their UV seams
; at load (80 % of their vertices are seam copies, each with its own chart's normal, so a bonnet
; shaded as a mosaic of flat facets). Angle-weighted face normals, kept apart only across a crease
; sharper than car_crease_deg (default 60). 1 (default) on, 0 the models' own normals.
car_smooth_normals=1
car_crease_deg=60

; car_coat - street views, plain renderer (never under RTX Remix, never in the classic view): the
; car paint's clear coat, a second pass over every car body (docs/vehicle-shading.md). Fresnel
; reflection of the street, a skyline and the sky above a horizon line, a per-pixel sun glint in
; place of the old per-vertex lobe, the base coat's sheen with a faint flake, crease darkening
; from the surface curvature, and panel gaps (door shut lines where the door animation cuts the
; door, bonnet and boot lines) from each car's own cabin measures. The colour stays identity.cpp's
; paint (the paint gate measures it). 1 (default) on, 0 the old look.
; devtools section: car_coat=0|1 live A/B, 2 shows the curvature, 3 the coat without the gaps.
; car_coat_f0_percent (4) the coat's reflectance face on; car_coat_reflect_percent (100) the
; reflection; car_coat_sky_percent (180) the reflected sky's radiance over the paint's;
; car_coat_power (350) the glint's sharpness; car_coat_crease_percent (100);
; car_coat_flake_percent (50); car_coat_sheen_percent (10); car_coat_rest_percent (35) the coat
; on the non-paint texels of a generated body; car_coat_gaps_percent (100) the panel gaps;
; car_coat_ffp_spec_percent (0) the old per-vertex lobe kept under the coat.
car_coat=1

; car_body_pitch, car_body_roll - street views. How far the drawn car body pitches
; (nose down under braking, tail down on a launch) and rolls in turns, in percent of
; what the suspension model computes (docs/vehicle-feel.md). A few real degrees of
; pitch barely move a car seen from behind, so the picture leans more: 220 and 170
; by default (at most 7 and 8 degrees drawn); the pitch turns about a point ahead
; of the middle so the tail lifts under braking and squats on a launch. 100 is the
; model's own angles, 0 a rigid body. Re-read once a second.
car_body_pitch=220
car_body_roll=170
;
; car_separation - street views. GTA2 lets cars in traffic sit partly inside each other
; (its boxes overlap by up to half a car in a jam or a crash; the flat top-down sprites hide
; it, 3D bodies do not). 1 (default) draws each overlapping pair moved apart by the overlap,
; half each (up to 0.35 block; the player's car seen from the seat stays put and the other
; takes it all); train carriages and a truck with its trailer are left coupled. Drawing only:
; the game's positions and collisions are unchanged. 0 draws them where the game has them.
car_separation=1

; Diagnostics. 1 writes every distinct frame of artwork beside the game as a TGA
; and a CSV of how each was classified. Useful when something looks wrong, and
; several thousand files when it does not.
dump_textures=0

; --- Objects in a wide frame's margins ---------------------------------
;
; spawn_offscreen - GTA2 works out what is on screen as a 4:3 rectangle
; whatever the screen really is, and creates and removes cars and
; pedestrians just outside it. A 16:9 frame of the same height is wider,
; so that happens inside our left and right edges and things appear out
; of nothing. The top and bottom never show it because the frame keeps
; GTA2's own height exactly.
;
; 1 (default) makes that rectangle the shape of the frame we draw, at
; the one place gta2.exe builds it, so spawning, recycling and drawing
; all move out together.
; 0 leaves gta2.exe byte for byte as it shipped, popping included. The
; same switch is on the Sprites tab of the F4 menu and can be turned off
; while the game is running: the patch keeps the bytes it replaced.
spawn_offscreen=1
;
; car_paint_soft_mask - 1 (default): a generated car's paint half (its
; "_paint" texture) gets a soft coverage mask and the car's repaint blends
; into the body over it in one draw, so a repaint far from the model's own
; colour no longer shows two flat tones with speckled, stair-stepped
; borders; wear and fire darken the whole body. 0: the importer's binary
; split, two alpha-tested draws (always so under RTX Remix).
car_paint_soft_mask=1
;
; model_textures_gpu_only - 1 (default): a model texture read from
; gta2dx9_models is kept on the GPU only (D3DPOOL_DEFAULT, filled from a
; staging copy that is then released): in the managed pool both Wine and the
; RTX Remix bridge keep a second copy of every texture inside the game's
; 32-bit address space (~500 MB once every model has been seen). Same
; texels, same Remix hashes. 0: every model texture managed, as before.
model_textures_gpu_only=1
;
; model_buffers_gpu_only - a model mesh's vertex and index buffers kept on the
; GPU only (D3DPOOL_DEFAULT, written once): in the managed pool the D3D runtime
; (and the RTX Remix bridge) keep a second copy of every buffer inside the
; game's 32-bit address space (~90 MB; the mesh itself is already held by the
; model store). Same vertices, same Remix hashes. -1 (default): on, except under
; Wine, where wined3d draws default-pool static buffers slower (many more frames
; over 50 ms, docs/performance.md FIX-PERF-6). 1 always on, 0 always managed.
model_buffers_gpu_only=-1
;
; car_copy_idle_seconds - a derived car copy (a dent step, a door split, a
; wheel split) that has not been on screen for this many seconds gives its
; vertex and index buffers back; they are made again (a few meshes a frame,
; the car drawn as before meanwhile) when it is wanted. -1 (default): 120 on
; Windows, off under Wine (there the re-made buffers cost frame time); 0 never.
car_copy_idle_seconds=-1
;
; car_paint_floor_percent - the least luminance a generated car's live paint
; is drawn with, in percent of white (default 30; 0 off). A near-black
; repaint otherwise multiplies the body to a flat black silhouette; under
; the floor the paint is lifted (hue kept) and the body gets a broader,
; sky-tinted sheen so its panels still read.
car_paint_floor_percent=30
;
; blood - GTA2 leaves a pool of blood under a body, but only with a debug
; flag the retail game keeps off. 1 (default) turns it on; 0 leaves the
; game's own setting alone. Also on the Sprites tab of the F4 menu.
blood=1
;
; gibs - experimental. A pedestrian killed by an explosion (grenade, rocket,
; a car going up) bursts into blood and flying limbs and the body goes, using
; sprites GTA2 ships but never draws. The limbs lie where they land and clear
; away with the blood. 0 (default) leaves deaths as the game has them; 1 turns
; it on. Also on the Sprites tab of the F4 menu.
gibs=0
;
; own_car_lamps - 1 (default) draws each lit car lamp as a small quad of its
; own, laid on the car and showing that car's own lamp pixels, so a lamp glows
; exactly where the car's artwork puts it. 0 draws GTA2's own lamp quad, a
; car-sized texture per car and lamp mix. Also on the Sprites tab of the F4 menu.
own_car_lamps=1
;
; gibs_car - with gibs on, pedestrians killed by a car come apart too, not only
; those killed by explosions. 0 (default) is explosions only; 1 adds cars.
gibs_car=0
;
; ragdoll - street views (third and first person). A person run over or struck
; by a car, or blown off his feet by a blast, goes down as a ragdoll instead of
; the canned lying clip: thrown by the car's own speed and direction (over the
; bonnet at speed, under the wheels when slow) or away from the blast, then
; tumbling and sliding to rest on the ground, kept out of walls. 1 (default) on;
; 0 plays the canned clips. GTA2DX9_RAGDOLL=0/1 overrides it. See
; docs/actions-3d.md, QB-27.
; (A/B for testers, environment: GTA2DX9_KD_NO_FLIP=0 lets the body somersault
; about its cross axis again and drops the slow-car forward knock, FIX-KNOCKDOWN-3:
; a slow van then stood a run-over man on his head, legs straight up, pfl77.)
ragdoll=1
;
; knockdown_full - street views. A car or a blast knocks a person down and the
; game stands the player up again a third of a second later, mid-fall. 1 (default):
; the drawn knock-down plays to its end: the fall and landing (the ragdoll), a
; beat lying still (down 1.3 to 3.2 s in all), the get-up that matches how he
; lies (on his back or his front), then the walk; first person rides his head
; down and up. 0: up as soon as the game says (as before). GTA2DX9_KNOCKDOWN=0/1
; overrides it. Needs ragdoll=1. (A/B, environment: GTA2DX9_KD_PIN_GETUP=0 lets the
; get-up of a fleeing person ride along with the game's spot again and start
; mid-fall, FIX-KNOCKDOWN-3 pf3.)
knockdown_full=1
;
; knockdown_hold_input - with knockdown_full, the game is not told of the
; player's movement, fire, enter and jump keys while he is down and getting up
; (street views only; keys still held afterwards are pressed again). 1 (default).
knockdown_hold_input=1
;
; intro - the DMA Design intro movie at startup. 1 (default) plays it, drawn
; by the renderer; 0 skips it. Either way it no longer goes through
; DirectDraw, which could crash the game at startup. Overrides the game's own
; do_play_movie setting.
intro=1
;

[timeofday]
; A day/night cycle, driven into RTX Remix's own sun through its API. The angles
; come from the real solar position equations for the latitude and season below,
; so the sun rises in the east, is highest at local noon, and spends the night as
; far below the horizon as it really would - which is what makes 2am dark rather
; than merely dim. 0 leaves whatever sun your rtx.conf sets.
enabled=1

; Clock when a level starts, HHMM. 200 is 02:00, which is deep night everywhere.
start_hhmm=200

; 1 stops the clock, so every level starts at start_hhmm and stays there: a fixed
; time of day, if you would rather always play at night, or at noon. 0 (default)
; lets the day run. Also the Paused box on the Time of day tab of the F4 menu.
paused=0

; Tenths. 10 = one real second to one game minute, a full day in 24 real minutes.
game_minutes_per_second_tenths=10

; When the lights that are off in daylight go out and come back on, HHMM: out by
; 06:00, on from 18:00, each over a short fade. Also on the Time of day tab of
; the F4 menu.
lights_off_hhmm=600
lights_on_hhmm=1800

; Tenths of a degree. Latitude sets how high the sun climbs; declination sets the
; season (+234 midsummer, 0 equinox, -234 midwinter).
latitude_tenths=400
declination_tenths=0

; Under RTX Remix: the auto-exposure cap (rtx.autoExposure.maxExposure) and the
; diffuse sky fill (rtx.atmosphere.skyIndirectRadianceScale) by day and by night, in
; tenths, pushed when the sun crosses the horizon. The night cap keeps the night a
; night; by day a higher cap and a stronger sky fill keep streets in building shade
; readable. 0 leaves the option to rtx.conf.
remix_day_max_exposure_tenths=60
remix_night_max_exposure_tenths=25
remix_day_sky_fill_tenths=30
remix_night_sky_fill_tenths=10
; Under RTX Remix at night: a dim warm light carried just above the player, in percent
; of a map lamp, so a covered pocket no street lamp reaches is not pitch black (GTA2 lit
; every surface with a constant ambient; a path tracer has none). 0 = off.
remix_player_fill_percent=25

[sky]
; The sky of the third- and first-person views: a dome with a sun and soft
; clouds, distance haze in the horizon's colour so streets fade into the sky
; instead of ending in black, and a directional sun on the city so the walls
; that face it are the brighter ones. The classic top-down view is never
; touched; the sky fades up and down with the move between views. Under a
; Remix runtime that draws its own atmosphere the dome is left out. 0 turns
; all of it off.
enabled=1

; 1 takes the sun from the [timeofday] clock (so a 02:00 start is a night sky
; and the day runs). 0 keeps it where the two lines below put it. auto (the
; default) is 1 under an RTX Remix runtime, whose own sky follows the clock (a
; fixed sun there lit a 4 pm street under a 02:00 star field), and 0 without,
; because without RTX Remix nothing else in the picture goes dark at night.
follow_clock=auto
; Tenths of a degree. Elevation above the horizon; azimuth is a compass bearing
; over the map, 0 north (up the map), 90 east. The default is a late afternoon.
sun_elevation_tenths=240
sun_azimuth_tenths=2350

; Distance haze, in blocks: none nearer than start, the full horizon colour
; from end. The map is 256 blocks across.
fog_start_blocks=18
fog_end_blocks=130

; How much of the sky the clouds cover, percent. 0 is a clear sky.
cloud_cover_percent=45

; The lighting of the city in those views, percent of the artwork's own
; brightness: ambient everywhere, plus the sun on a face that squarely faces
; it. 100 and 0 draw the artwork as the classic view does.
ambient_percent=80
sun_light_percent=40

[visuals]
; The plain (non-Remix) renderer's modern look in the third- and first-person views
; (docs/visuals-plain.md): sun shadows from the [sky] sun, ambient occlusion, a sky
; hemisphere term, the night's lamps, neon and car lamps as real lights, bloom and a
; filmic tonemap, plus a richer sky (golden hour, dusk, stars). The classic top-down
; view is never touched, and under RTX Remix all of it stays off by itself (Remix
; lights the scene). Re-read every two seconds while the game runs. 0 = the look of
; v1.5. Off by default until the sun shadows are verified (docs/visuals-plain.md).
enabled=0
; Each pass on its own (1 on, 0 off).
shadows=1
ssao=1
bloom=1
tonemap=1
lights=1
hemisphere=1
; low: one shadow cascade (30 blocks), bilinear PCF, no AO, 16 lights.
; medium: two cascades (14 and 56 blocks), 16-tap PCF, AO with 8 samples, 32 lights.
; high: three cascades (9, 28, 85 blocks), AO with 12 samples, a second wider bloom, 64 lights.
quality=medium
; 1: the far shadow cascades are redrawn on alternate frames (the near one every frame);
; saves about a third of the shadow pass, moving shadows beyond 14 blocks lag one frame.
shadow_stagger=1
; 1: the shadow on the car you drive is eased over about 10 frames (its pixels only), so a
; building's shadow edge or a turn against a low sun does not flip the whole body from lit to
; shaded in two frames; 0: the exact per-frame shadow (A/B, re-read live). feel29.
car_shadow_blend=1
; Tuning, percent. Shadow strength 100 removes exactly the sun's share of the light.
shadow_strength_percent=135
ao_strength_percent=75
bloom_strength_percent=55
bloom_threshold_percent=80
exposure_percent=100
saturation_percent=110
light_intensity_percent=100
; The world's fixed-function sun and ambient while these passes are on.
sun_boost_percent=150
ambient_scale_percent=84
; The sky's light on the city through twilight (from 4 deg above the horizon down, while the dome is still lit),
; percent of the ambient level: walls turned from the sky keep a cool fill instead of going black under a
; bright dusk sky (qav7). Applies with these passes on or off; never under RTX Remix. Re-read live. 0 = before.
twilight_fill_percent=60
; Developer: move the sun while the game runs (tenths of a degree; -9999 = the [sky] keys).
sun_elevation_tenths=-9999
sun_azimuth_tenths=-9999

[weather]
; Weather and time of day in the plain (non-Remix) renderer's third- and first-person
; views (docs/weather.md): rain streaks around the camera, an overcast sky, fog banks
; that thicken and thin as you move through the city, and wet roads that darken and
; reflect the street and the night's lights (the reflection needs [visuals] enabled=1).
; The classic top-down view is never touched and under RTX Remix none of it runs.
; Re-read every second while the game runs. Off by default until verified.
enabled=0
; 1: the street views' sun follows the [timeofday] clock (golden hour, blue hour and
; night with the lamps, neon and lit windows on); 0: the fixed [sky] sun.
time_of_day=1
; Developer: set the clock to this time, HHMM, whenever the value changes (-1: leave
; it); clock_paused 1 holds it there, 0 lets it run, -1 leaves [timeofday] paused.
hour_hhmm=-1
clock_paused=-1
; The weather, percent. Ignored while cycle=1, which changes it by itself between
; clear, cloudy, drizzle, rain, storm and fog spells of about cycle_minutes each.
rain_percent=0
cloud_percent=0
fog_percent=0
wind_percent=30
cycle=0
cycle_minutes=6
; Seconds to ease into a new setting (0: at once).
fade_seconds=20
; The rain's streaks (count at full rain) and the wet-road pass. The roads wet in
; about half a minute of heavy rain and dry over two and a half minutes after it;
; wet_percent (developer) forces their wetness (-1: follow the rain).
rain_streaks=1
rain_drops=1600
wet_roads=1
reflection_percent=100
wet_percent=-1

[camera]
; Tenths of a degree. Zoom and position come from the game; these only frame it.
; -900 looks straight down, which is what GTA2 was drawn for.
pitch_tenths=-900
fov_tenths=400

; --- Third person and first person --------------------------------------
;
; mode - the view a level starts in: classic (GTA2's own, from above), third
; (a chase camera behind you, on foot or at the wheel, with mouse orbit) or
; first (from your eyes or the driving seat, with mouse look).
mode=classic
;
; toggle_key - the key that cycles the three views in game. A single letter
; or digit, an F-key (F6), or a virtual-key code (0x56). V is free in GTA2's
; default controls.
toggle_key=V
;
; switch_dissolve_percent - keep 0. The move between the classic view and a
; street view is one camera move over the live world with no image effect: V
; only starts the camera, and what the picture shows follows the camera's
; progress (the game's sprites, HUD and plain tiles until the fastest part of
; the move, then the figures, models, modern HUD and photo tiles; the ground's
; material cross-fades on the same geometry). A fallback only: above 0, the
; last classic frame is laid over the start of the move and dissolves over
; this share of it, which shows as a double exposure (BEV-PURITY, 83fb363).
switch_dissolve_percent=0
;
; mouse_look - 1 looks round with the mouse in the two views (orbit in third
; person, free look in first); 0 turns with the keys only. A remote session
; (VNC, a remote desktop) places the pointer rather than moving it, which the
; look scheme sees as jumps, so the browser play container sets 0.
mouse_look=1
;
; turn_speed - one knob for how fast everything turns in the two views, a
; percentage: the camera, the keyboard look, the mouse, the drawn figure. 100
; is the console-style default; 50 halves them all. Also on the F4 Camera tab.
turn_speed=100
;
; turn_budget - the most the third-person picture on foot may turn in one
; frame, in degrees at 30 fps (yaw and pitch each; scaled by the frame time).
; Every frame whose camera wanted more is logged ('view: turn over budget') and
; shown at the budget; under it the chase boom swings round what stands behind
; you at three quarters of that rate, cuts round a pocket with no way open at
; most once in 2 s (a cut moves the lens, it is not a turn: logged as 'view:
; camera cut'), and keeps its length past a phone box (the box fades) instead
; of snapping in. 8 = 240 degrees a second. 0 turns the budget off (as before).
turn_budget=8
;
; chase_hide_near_peds - 1 (default): in third person a pedestrian standing
; within about half a block of the lens, or across the line from the lens to
; you within a block of it, is not drawn while it is there (it filled the
; frame with a head and shoulders and hid you). 0 draws them as before.
chase_hide_near_peds=1
;
; pocket_lift - 1 (default): in third person on foot, in a pocket with no way
; round open (a kerb strip between a wall and a railing you walk against), the
; chase boom first stops counting the railing you lean on (its bars are
; see-through: for 20 s while you stay within 2.5 blocks of that spot) and
; rises over what closes the line before it cuts round you. 0: the cut as
; before ('cam: pocket:' lines in the camera log).
pocket_lift=1
;
; chase_ped_fade - 1 (default): a pedestrian hidden at the chase lens fades out
; and back in over six frames instead of popping, and a car or wreck standing
; between the lens and you (within 3 blocks of the lens) fades out the same
; way while it is there. 0: the pedestrian pops and cars stay whole as before.
chase_ped_fade=1
;
; level_start_cut - 1 (default): a new level (a new game, a replay) opens a
; street view at its camera behind you; 0: the 1.4 s move down from the classic
; camera as before (it flew over the whole city).
level_start_cut=1
;
; nav_map - camera-relative controls on foot in the two views, as a modern
; game plays: the arrows mean "walk that way as the camera sees it" (Up toward
; where the camera looks, Left and Right to its sides), and the pedestrian is
; steered onto that heading through the game's own turn keys, pressed for him
; by the renderer; the game's movement, speeds and collisions stay its own.
; In first person Left and Right turn the view: from 25 degrees a second,
; winding up to first_turn_key_rate over 0.8 s, dying away over 0.15 s on
; release; the pedestrian follows. In a car the driving keys are untouched.
; 0 leaves the arrows to the game (it turns the pedestrian in a few frames).
nav_map=1
;
; aim_assist - on foot in the two street views (never in the classic view), an attack
; press with a person in front of him is held back for a moment while the game's own
; turn keys bring his heading onto that person, then handed to the game: with fists the
; person within 1.2 blocks and 75 degrees (he also steps in to touching distance, which
; is GTA2's own punch reach), with a gun within its reach and 30 degrees (12 in first
; person). At most 0.6 s (fists) or 0.25 s (a gun). The reticle brackets the same person.
; Nothing is written into the game. 0 = off (GTA2DX9_AIM_ASSIST=0 for one run).
aim_assist=1
;
; aim_cover_walls - (FIX-AIM-2) with a gun, a person counts as behind cover (no pick, no
; reticle bracket) only when the line to him crosses a wall; a lid alone (a kerb step, a
; deck) does not hide him (the game hit men the lid test called covered). 0 = the old test that also
; counted lids (GTA2DX9_AIM_COVER_WALLS=0 for one run).
aim_cover_walls=1
first_turn_key_rate=70
nav_turn_sign=1
;
; orbit_follow - third person on foot. 0 (default): the soft follow below;
; standing still with no key held the camera holds its yaw. 1: the earlier
; drift round behind whichever way you walk (over 1.5 s).
orbit_follow=0
;
; car_impact_shake - at the wheel in the two views: the camera's kick when the car
; hits something, scaled by the speed it lost (measured by the car body model,
; docs/vehicle-feel.md), in percent; 0 is none. (The F4 menu's Impact shake is a
; separate, older kick from the camera's own velocity, off by default.)
car_impact_shake=100
;
; ped_hit_bump - at the wheel in the two views: a pedestrian struck by your car
; gives the camera one short nod (nose down and back, a small drop, settled in
; ~0.3 s), scaled by the speed and the man's mass against the car's (a saloon
; at 3 blocks/s about 2 degrees, a van at 1.5 about 0.7, a truck less); nothing
; under 0.5 block/s. Percent; 0 is none. (FIX-KNOCKDOWN-5)
ped_hit_bump=100
;
; first_body_ride - first person at the wheel: how much of the drawn body's
; pitch, roll and bounce the eye rides, in percent (100: the eye sits in the
; body, the street tilts on braking and in turns; 0: the eye stays level).
first_body_ride=100
;
; dashcam_key - first person at the wheel: switches between the cockpit (the
; dashboard, the steering wheel turning the car's way and your own driver's body,
; arms on the wheel) and a clean dashcam: a camera on the windscreen, a little
; higher, further forward and nearer the car's middle than your eyes, with no
; wheel, hands or body and a level horizon (no head lean, no body roll). The HUD
; stays. The move between the two takes 0.4 s. The choice stays through a view
; change (toggle_key) and getting out and back in; it only shows in first person
; in a car. A letter, an F-key or a virtual-key code, as toggle_key. C is free in
; GTA2's default controls.
dashcam_key=C
; dashcam - 1 starts with the dashcam chosen (0: the cockpit).
dashcam=0
; dashcam_up, dashcam_ahead - the dashcam's eye against the driver's, in
; thousandths of a block (a block is about 3.9 m; the cockpit is drawn at about a
; third of the street's scale, so 12 reads as a hand). dashcam_centre - how far
; toward the car's middle, percent of the way from the driver's seat.
dashcam_up=12
dashcam_ahead=35
dashcam_centre=60
;
; fp_driver_body - first person at the wheel (the cockpit, not the dashcam): your
; own seated body under the eye, in your own clothes (the same figure the chase
; view shows at the wheel): shoulders, arms to the hands on the wheel, lap and
; legs to the pedals; look down to see it. 0: only the hands on the wheel.
fp_driver_body=1
; (A/B for testers, environment: GTA2DX9_FP_WHEEL_OLD_SIGN=1 turns the wheel the
; old, wrong way round (5c0ee78); GTA2DX9_FP_WHEEL_TURN_MILLI=N holds the rim at N/1000
; rad, + toward the screen's right at the top.)
; (GTA2DX9_FP_GRIP=0: the old fists on the wheel (5c0ee78), GTA2DX9_FP_PILLARS_OLD=1
; the old windscreen frame; live devtools keys fp_grip_tilt/fp_grip_deg/fp_grip_curl/
; fp_hand_scale tune the grip, docs/navigation.md; GTA2DX9_DASHCAM_FRAME=1 draws the
; pillars and the header in the dashcam as before.)
; (FIX-COCKPIT-CAB-5: with fp_driver_body=1 the wheel's stand-in fists are never drawn
; for a frame his body missed (log 'cab: his body not drawn'); GTA2DX9_FP_STANDIN=1
; draws them in any gap as before. GTA2DX9_SEAT_KEY_OLD=1: a passer-by handed his old
; sprite object who sits in a car takes the player's seat record again, as before.)
; (GTA2DX9_FP_BODY_CULL_OLD=1: his body at the wheel culled by the view tests as before,
; which lost it in tall cabs such as the fire truck.)
;
; follow_tau_walk, follow_tau_run, follow_delay - the soft follow on foot, as
; GTA V's camera: while you walk the camera eases round behind the way you go,
; a critically damped swing (no overshoot) over about follow_tau_walk seconds
; at a walk and follow_tau_run at a run, never faster than turn_rate_foot. A
; turn is followed only after follow_delay seconds, and a turn key pressed
; while standing turns you with the camera following. The arrows are read
; against the camera as it was when you pressed them, so a held key walks you
; straight on while the camera settles behind you. follow_tau_walk=0 turns the
; follow off: the camera then holds its yaw while you walk and re-centres
; slowly (over 4 s) once you have walked straight away from it for 2 s.
follow_tau_walk=1.5
follow_tau_run=1.0
follow_delay=0.4
;
; turn_rate_foot - the fastest the third-person camera turns on foot, degrees
; a second (the mouse orbit, the follow). turn_rate_car - the chase camera
; at the wheel, damped over 0.8 s. First person at the wheel is fixed to the
; car with a 120 ms ease. The drawn figure in third person turns at most 240
; degrees a second with a 120 ms ease (the game's heading underneath snaps as
; it always did). All of these scale with turn_speed.
turn_rate_foot=120
turn_rate_car=90
;
; Everything else about the two views - distances, heights, fields of view,
; mouse sensitivity, head bob, lean, impact shake (all calmer by default now),
; whether pedestrians are stood up - is on the Camera tab of the F4 menu and
; saved to gta2dx9_settings.ini with the Save button.
;
; demo_switch_seconds - for recording a demonstration: this many seconds after
; a level comes up, the view switches by itself to demo_switch_to (1 third
; person, 2 first person), as if the key had been pressed. 0 never does.
; tools\record_demo.ps1 sets these and records the screen.
demo_switch_seconds=0
demo_switch_to=2

[density]
; Traffic and people in the chase and first-person views. GTA2 sized its budgets
; for the top-down window: at most 16 ambient cars, and people only while the
; window holds fewer than zone density / 25 (8 in Downtown) and fewer than 50
; exist. The street views widen that window 2.6x ([camera] GameViewScale), so the
; same budgets left the boulevards empty. These raise them while a street view is
; up; the classic view always runs gta2.exe exactly as shipped.
;
; The three budgets below are the most it goes to. More people and cars cost
; frame time (skinned figures above all), so the renderer follows the frame rate
; it gets: over 15% of frames late in 2 s steps them down a level (four levels,
; the lowest is the game's own), under 5% for 4 s steps them back up. It also
; falls back to the game's own while fewer than 40 of the 200 people the game
; can hold are free (gta2.exe crashes if they run out).
;
; traffic_cap - ambient cars alive at once (stock 16; 16 or less changes nothing;
;   at most 100). Every car carries a driver from the 200-person pool.
;   24 since FIX-TRAFFIC-1 (10 Nov; was 36): at 36 GTA2's junctions could not
;   take the extra cars - they only queued (Residential: 3 of 11 cars near the
;   player moving, against 4 of 9 at 24) and the stop-start the owner saw grew
;   with it. GTA2DX9_TRAFFIC_CAP=<n> in the environment overrides this.
traffic_cap=24
; ped_density_scale - 1, 2, 4 or 8 times the people each zone allows in the window
;   (1 is stock).
ped_density_scale=4
; ped_cap - ambient pedestrians alive at once (stock 50, at most 120; 0 leaves the
;   game's own). The game still halves it above three wanted stars.
ped_cap=80
; zone_car_density - GTA2 takes the traffic density from the zone the player
;   stands in, not from the road a car comes onto, and Downtown's script gives
;   the church plaza at the start 0 cars, so standing there stopped all traffic
;   on the roads in view. 1..1000 gives such a zone that density while a street
;   view is up and the player is in it; 0 leaves every zone as the script set it.
zone_car_density=400
; grid_headroom - 1 (default): the game's object grid (every car, person and
; object is linked into the map blocks it covers, from two fixed node pools of
; 4096 and 6000 that the game never checks for empty; the first idles at only
; 450-700 free in ordinary play) is watched, and the raised
; budgets above stand down to the game's own while fewer than 240 / 400 nodes
; are free (back above 400 / 600), as they do for the ped and car pools; a dry
; pool is gta2.exe+0x47352 reading 00000004. 0: not watched.
grid_headroom=1

[hud]
; The modern HUD of the street views (third and first person; docs/hud.md). The classic
; view always keeps the game's own HUD. modern=1 draws money (ticking), multiplier, lives,
; health (with a damage flash and a low-health pulse), the car's condition, wanted stars,
; the weapon with its ammunition, the mission brief with the speaker's portrait, the phone
; prompt, a mission clock and counter, the gang respect meters (top left), and a round
; mini-map of the level's roads with the objective, drawn as vectors (sharp at any resolution);
; the game's own score, hearts, wanted heads, respect bars, talking head and clocks are not
; drawn then. modern=0 leaves the game's HUD in the street views as well.
modern=1
; minimap=0 leaves the mini-map out.
minimap=1
; hearts=1: the game's row of hearts top right in the modern HUD (the player's health as the
; game counts it: a heart a started 20, five at full), drawn as vectors; 0 leaves them out.
hearts=1
; game_font=1: the money, multiplier, lives, hearts and ammunition of the modern HUD in GTA2's
;   own type: the sprites the classic view draws them with, read from the level's style file at
;   load (never stored) and re-authored at the display's pixel size (a whole factor, 2 at 720p and
;   4 at 1440p, drawn 1:1: no filtering). The layout stays the modern one. 0 = the Barlow typeface.
game_font=1
; game_font_smooth=1: those glyphs enlarged edge-aware (Scale2x/Scale3x: stair-step edges become
;   clean diagonals, colours and the bevel stay exact); 0 = plain whole pixels.
game_font_smooth=1
; objective_markers=1: in the street views the game's target arrows (the flat sprites it lays
; round the player for the top-down camera, which hovered on the figure's chest in third person
; and mid-screen in first) are shown through the 3D camera instead: a diamond and the distance
; over the target, or a chevron on the screen edge pointing toward it. 0 keeps the game's sprites.
; The marker is a shaded pin lifted over any wall between the eye and the target; it is drawn and
; the game's arrows are dropped whatever modern= says. The classic view always draws the game's own.
objective_markers=1
; scale_pct - the modern HUD's size, 50..200 (100 = sized for the window's height).
scale_pct=100
; toggle_key - a key that switches modern/classic while playing (e.g. F7); empty = none.
toggle_key=

[beats]
; QB-17/18: framed beats in the street views (third and first person; the classic view
; keeps the game's own). When the game puts up WASTED (or TOASTED/SHOCKING), BUSTED or
; JOB COMPLETE (its big message, matched to the texts of data\e.gxt), the camera leaves
; the chase and frames the player - over the body craning in for a death, eye level for
; an arrest, in front of him and low for a job well done, turning slowly round him and
; pulled in clear of walls - with letterbox bars, a colour cast, the game's own words as
; a large title (the game's own big text is then not drawn) and a music sting hook. A
; death or an arrest fades to black and back in once the game has moved him (hospital,
; police station), so the respawn is not a cut; a job hands back to the chase camera.
; enabled - 1 (default) on; 0 leaves the game's message over the chase camera.
enabled=1
; complete_ms - how long the JOB COMPLETE beat lasts (1500..10000, default 4200).
complete_ms=4200
; fade_after_ms - when a death or an arrest beat starts going to black (500..9000,
;   default 1600; the game moves him about 70 frames after its message).
fade_after_ms=1600
; sting_wasted, sting_busted, sting_complete - the music sting: a .wav file played once
;   as the beat starts (a path relative to the game's folder); empty (default) plays
;   nothing. A program can take the hook instead (BeatsSetStingHook in dll/src/beats.h).
sting_wasted=
sting_busted=
sting_complete=
[audio]
; Positional sound in the street views (third and first person; docs/audio3d.md). The game
; pans every sound for its top-down camera (east = right, north = ahead); positional=1
; (default) turns each sound's offset into the street camera's frame, so a car behind the
; chase camera is heard behind, one to its left on the left. The classic view is untouched.
positional=1
; listener - player (default): offsets measured from the player, not the game's camera, which
; leads a fast car by a few blocks; game: the game's own listener, only turned.
listener=player
; log_every - one "audio3d:" log line every N positioned sounds (0 = none; a QA aid).
log_every=0

[crowd]
; People in the street views (third and first person; the classic view is
; untouched). GTA2DX9_CROWD=0 in the environment turns all of it off for a run.
;
; variety - 1 (default): every civilian gets clothing colours of his own (the
;   "_paint" half of the avatar's texture recoloured from a palette of everyday
;   clothes, a quarter keep the avatar's own) and a build of his own (height
;   +-6%, width +-5%), fixed by his object so he keeps his look. Gang members,
;   police, medics and the other uniforms keep their colours; the player keeps
;   his. 0 draws every avatar as it was imported.
variety=1
; look_at - 1 (default): people near the player (within look_range blocks, in
;   front of them) turn their head to follow him; a gunshot nearby turns heads
;   too. Standing people glance about every few seconds, walkers now and then.
;   0 keeps the heads on the clip.
look_at=1
; look_range - blocks (1..12, default 5).
look_range=5

[city_ai]
; City life in the street views (docs/city-ai.md). gta2.exe's own pedestrian AI, with three
; of its distances sized for a camera in the street instead of the top-down window, in the
; third and first person views only (the classic view keeps every byte as shipped).
; enabled=0 (or GTA2DX9_CITY_AI=0 in the environment) leaves the game's reactions alone and
; keeps the census.
enabled=1
; gun_radius - blocks within which a passer-by runs from someone firing a weapon (game: 4).
gun_radius=12
; car_radius - the same for someone driving recklessly (game: 4).
car_radius=5
; safe_distance - how far a fleeing ped runs from the threat before he calms down (game: 6;
; anything told to flee from further than this stopped at once).
safe_distance=14
; dodge - a passer-by in the path of a car doing more than dodge_speed blocks/s, at most
; dodge_time seconds ahead of it, runs straight off its path (the game's own flee objective).
dodge=1
dodge_speed=2.0
dodge_time=1.4
; fire_radius - blocks within which passers-by run from a burning car.
fire_radius=4
; census_every - frames between census samples for the `ai:` log lines (two samples a line;
; 0 = no census); census_radius - blocks round the player that are counted.
;   Traffic part (FIX-TRAFFIC-1): freestop = stopped with no car within 1.6 blocks
;   ahead, split by cause as fs_ped (someone on foot within 2 ahead), fs_gap (a car
;   1.6-3.5 ahead: GTA2's own following distance, so a queue), fs_cross (a car across
;   its path), fs_junction (at or up to 3 blocks before a junction: lights, give-way),
;   fs_mid (none of these); stops / hardstops / stopstart = stop events since the last
;   line (a hard one from over 2.5 blocks/s, a stop-start one under 2 s after getting
;   going). The player's own car and cars still at rest where they were created are
;   left out. GTA2DX9_TRAFFIC_LOG=1 adds an `ai: stop` line per free-stopped car.
census_every=15
census_radius=20

[devtools]
; Developer aids for scripted sessions (linux/docker/run_game.sh and the
; gamerun scripts drive the game from the renderer's log). All off by default.
; log_keys=1 writes one log line per press and release of the game's control
; keys. warp_key moves the player to the driver's door of the nearest parked
; car; scene_key brings the nearest parked car to scene_xy, heading east,
; with the player at its door - which is how the driving demonstration
; (tools: gamerun/drive_road.py) gets a car on a real road. A third number is
; the map level, e.g. 160.7,132.1,3; without it the player's own level is the
; reference. Either way the warp lands on a surface: the floor under the point
; at that level, else the nearest road cell within six blocks (at that level,
; then at any), else the nearest pavement cell; with none it is refused and the
; log says so, rather than leaving him in the air or under the map.
log_keys=0
warp_key=
; enter_key (FIX-ENTRY-1) - runs the game's own entry (the objective a Return sets: run to the
; driver's door, open it, climb in) on the nearest driverless car on his level within 8 tiles,
; whichever way he faces, without the keyboard path; the car becomes his as in a real entry and a
; Return afterwards gets him out. Empty = off; e.g. enter_key=B (a letter, an F-key
; or a virtual-key code; not F8, which opens GTA2's Options = the F4 panel). GTA2DX9_LOG_ENTRY=1 (environment)
; logs every Return the game's keyboard reports and what the game did with it, and says so when
; Windows saw a Return the game never got. docs/actions-3d.md "FIX-ENTRY-1".
enter_key=
scene_key=
scene_xy=164.5,149.5
; scene_xy is re-read from this file on every scene_key press, so a test script
; can retarget the warp mid-run by editing the line.
; ped_remap_override: a developer aid for the 3D people's types. -1 (default)
; draws each pedestrian as the remap the game gave him; 0..52 draws every
; pedestrian but the player as that remap (0 police, 4 army, 8 Zaibatsu, 11
; Loony, 13 Yakuza, 14 fireman, 16 medic...); -2 deals the uniformed and gang
; types out across the crowd, to see them all at once.
ped_remap_override=-1
; wreck_models - 1 draws every car in the street views as one of the burnt-out
; wreck models (072..081), to check them without blowing a car up.
wreck_models=0
; force_car_model - draw every traffic car in the street views as this CARI model
; number (0..81), to look at one model from the chase camera; re-read once a
; second while the game runs. -1 is off.
; force_car_damage - a developer check: every car body is drawn at this damage word
;   (the game's int16 at vehicle+0x74: 0 fresh .. 32000; dents in four steps from
;   4000/8000/16000/25000, scorched paint from 16000 and darker from 25000, as when the
;   game sets a car alight); drawing only, the game's own damage is untouched. -1 leaves
;   each car its own. (The set_car_damage key writes a value into the player's car itself.)
force_car_damage=-1
; force_car_paint - a developer check: R,G,B (0-255) as every non-livery car's live
; paint (re-read once a second), e.g. 18,18,22 for the dark-paint check; it also
; applies to the models force_car_model draws. Empty: off.
force_car_paint=
; paint_sky_cast - 1 (default): a car's paint tint takes out the colour cast the [visuals]
; hemisphere term lays over its lids (the sky's blue from above), so the lit body keeps the
; classic sprite's hue (FIX-CAR-IDENTITY-6). 0: off, for same-spot A/B frames. Re-read live.
paint_sky_cast=1
; hood_drop_dark - 1 (default): the first-person copy of the own car drops faces
; whose texture is near black where it is not paint (an image-to-3D shell's inner
; wings and cowl, torn black shards from the seat); 0 keeps them, for A/B checks.
hood_drop_dark=1
; fp_bonnet - 1 (default): from the driver's seat (plain renderer) the own car's bonnet
; is a clean surface sampled from the body's top ahead of the windscreen, in the body's
; colours, instead of the hull cut at the eye (torn slivers on the generated meshes);
; 0 draws the cut hull, for A/B checks. Remix keeps the cut hull.
fp_bonnet=1
; hood_dash - 1 (default): when the seat draws that bonnet (or only the cab of a flat
; front), the hood copy is not built, only its dashboard line measured (FIX-PERF-3: the
; copy cost ~30 ms on the render thread at each 0.04-block eye step); 0 builds the copy
; as before, for A/B checks.
hood_dash=1
; force_car_door - a developer check: every car body is drawn with a door swung open
;   (1 the right door, -1 the left); 0 leaves the doors to the people getting in and out.
force_car_door=0
; door_exact_cut - a developer check (re-read once a second): 1 (default) cuts a car's side
;   panels exactly along an opening door's outline; 0 is the old split (the hole ended in the
;   hull's triangle edges: teeth down the door's edge). Same-spot A/B (FIX-SEAT-ENTRY-3).
door_exact_cut=1
; door_interior - a developer check: 1 (default) draws a dim cabin (a box, and the door's own
;   panel mirrored on the far side) behind an open door; 0 shows whatever the hull has there.
; door_interior=2: the cabin in the old darker tone by day too (FIX-SEAT-ENTRY-4 lifted it: from the
;   eye at the door it read as a black hole). Night keeps the dark tone either way.
door_interior=1

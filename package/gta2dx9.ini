;   steer follows the car's motion. Re-read once a second.
force_steer_deg=0
; force_wanted - a developer check for the police: the player's wanted level is
;   kept at least this many stars (1..6; his cop points, ped+0x20A, the field the
;   game raises for a crime), so the police come for him without a massacre first:
;   from 2 stars officers reach him and arrest him (stand near a cop car), 6 brings
;   the army with tanks. -1 (default) is off. Re-read once a second while the game runs.
force_wanted=-1

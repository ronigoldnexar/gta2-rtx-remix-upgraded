;   the front seat of the cabin built behind its glass (car_glass), the seat seen through the windows.
;   0 = the seat from the sprite's window rows (put the 001 Wellard's driver on the rear deck). Re-read live.
glass_seat=1
; seat_well - FIX-COCKPIT-CAB-6 (qav51): an open-top body (the cab table's open tops) with neither a manifest
;   driver_seat nor a glass cabin (031 Jefferson, 045 Spritzer, 022 armed Land Roamer) seats its driver in the
;   cockpit well found in its own mesh (seat_well.cpp: the rows behind the windscreen where the driver's band

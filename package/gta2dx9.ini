force_blast=0
; force_burn - the same, but the car is only set alight (it then burns up by itself, about
;   530 game seconds to the blast unless hit).
force_burn=0
; force_blast_car - near (default): the car nearest the point force_blast_dist ahead of him
;   along the camera's view, among the cars within 40 degrees of the view when there are any;
;   own: the last car he drove in a street view (he must have left it).
force_blast_car=near
; force_blast_dist - tenths of a block, the aim point's distance ahead of him (default 40).
force_blast_dist=40
; set_player_ammo - a developer aid for scripted shooting (QB-6): the gun in the player's
;   hands is refilled to this much ammunition once it falls below half of it (the game's
;   word; the machine gun's 300 shows as 30). -1 (default) is off. Re-read twice a second.
set_player_ammo=-1

[explosions]
; Explosions in the street views (third and first person; the classic view is
; untouched): every blast the game draws gets a volumetric fireball of billows
; cooling from white-hot to red and rolling into dark smoke, a flash with a pool of
; light on the ground and a point light on the cars nearby, a shock ring and dust
; over the road, sparks and burning bits, and a smoke column off the spot.
; GTA2DX9_EXPLOSION_FX=0 in the environment turns it off for a run.
;
; enabled - 1 (default) on; 0 leaves the game's flat blast sprite alone.
enabled=1
; size_percent - the whole blast's scale (10..400, default 100).
size_percent=100
; flash_percent - the flash, the ground light and the car light (0..400, default 100).
flash_percent=100
; smoke_seconds - how long the column keeps rising off the spot (0..120, default 10).
smoke_seconds=10
; sprite_percent - how much of the game's own blast sprite is kept under the
;   fireball (0..100, default 35).
sprite_percent=35
; car_light - 1 (default) lights the car models orange while a blast flashes
;   (plain renderer; under RTX Remix the fireball's emissive particles do it).
car_light=1
; eye_budget_percent - how much additive light (fireball, sparks, flash, ground
;   light) a blast may throw over the view, in hundredths of a full frame; over it all
;   of them are dimmed together (first person beside a blast, the death camera).
;   5..1000, default 50.
eye_budget_percent=50

[remix]
; Only read under an RTX Remix runtime.
; Light samples of Remix's direct lighting (RTXDI) per pixel: initial, spatial reuse,
; after disocclusion. 0 leaves Remix's own value.
di_initial_samples=16
di_spatial_samples=3
di_disocclusion_samples=8
; own_shadow_first_person - EXPERIMENTAL, 0 (default) hides the player's own figure
; in first person as the plain renderer does. 1 still draws it, with copies of its
; textures listed in rtx.playerModelTextures, meant for Remix to keep it out of the
; eye's rays while it casts its shadow (the classic view's sprite casts one). Not
; working yet: the runtime does not match the copies' hashes (docs/remix-3d-quality.md).
own_shadow_first_person=0

;   before that 1 (cut-out wisps with a binary alpha edge). Remix only; the plain renderer and classic unchanged.
remix_puff_mode=4
; stall_dump_test - 1 proves the stall dump (FIX-DEADLOCK-1, docs/performance.md): a test thread
;   holds a lock for 10 s and the game thread waits for it at its next frame; after 5 s at one
;   address the stall sampler writes 'stall dump:' lines (every thread of the process with its
;   name, start address, registers and stack, the owner of each lock on the game thread's stack,
;   the faults a guard swallowed) and must name the 'stall-dump test' thread as the owner. The
;   dump itself is always on (at most 3 a session, after 5 s at one address). 0 (default) off.
;   Re-read once a second.
stall_dump_test=0
; simulate_focus_loss - N > 0 (FIX-STABILITY-1, owner-5090-minimize-fatal): a test thread sends the game
; window what Windows sends when another window takes the focus, N times: WM_KILLFOCUS, WM_ACTIVATEAPP 0,
; WM_SIZE SIZE_MINIMIZED, then 3 s later WM_SIZE SIZE_RESTORED, WM_ACTIVATEAPP 1, WM_SETFOCUS. The log shows
; "focus: game window minimised ... presenting paused" and "restored ... presenting again". Starts
; simulate_focus_loss_start_s after the level is up, simulate_focus_loss_gap_s between cycles. 0 = off.
simulate_focus_loss=0
simulate_focus_loss_start_s=30
simulate_focus_loss_gap_s=8
; simulate_focus_loss_restore - 1 (default) sends the restore 3 s into each cycle; 0 sends none, which is
;   the owner box (nobody restores GTA2's window under own_window=2): with keep_game_window_restored=0 the

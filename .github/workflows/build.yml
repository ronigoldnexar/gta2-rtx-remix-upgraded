name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the renderer (dll\build.bat)
        shell: cmd
        run: dll\build.bat

      - name: Build the video device shim (vid\build.bat)
        shell: cmd
        run: vid\build.bat

      - name: Stage the files a player drops into the GTA2 folder
        shell: cmd
        run: |
          mkdir stage
          copy /y dll\build\gta2dx9.dll stage\gta2dx9.dll
          copy /y dll\build\gta2dx9.dll stage\d3ddll.dll
          copy /y vid\build\gta2dx9_vid.dll stage\gta2dx9_vid.dll
          copy /y vid\build\gta2dx9_vid.dll stage\Dmavideo.dll
          copy /y vid\build\gta2dx9_vid.dll stage\DMAGlide.dll
          copy /y package\gta2dx9.ini stage\gta2dx9.ini

      - uses: actions/upload-artifact@v4
        with:
          name: gta2dx9-x86
          path: stage/
          if-no-files-found: error

  mingw-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW-w64 cross compiler and 32-bit Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686 make wine wine32:i386 xvfb

      - name: Build both DLLs on Linux (make)
        run: make -j"$(nproc)" stage

      - name: Load them under Wine and resolve every export (make check)
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEARCH=win32 WINEDEBUG=-all
          wineboot -i || true
          make check WINE="xvfb-run -a wine"

      - uses: actions/upload-artifact@v4
        with:
          name: gta2dx9-x86-linux-built
          path: |
            stage/
            !stage/loadcheck.exe
          if-no-files-found: error
